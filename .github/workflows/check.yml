name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: brew install xcodegen
      - run: bash scripts/build.sh
      - run: node renderer/generate-fixtures.mjs
      - run: bash scripts/test-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-regression-evidence
          path: |
            build/*regression.log
            build/wk-regression.json
            build/wk-regression.png
